name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile CopilotToAntigravity.exe
        shell: pwsh
        run: |
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:winexe /platform:x64 /optimize+ `
            /out:"CopilotToAntigravity.exe" `
            /r:System.Windows.Forms.dll `
            /r:System.Drawing.dll `
            "CopilotToAntigravity.cs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package release ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/AntigravityCopilotKeyShortcut | Out-Null
          Copy-Item CopilotToAntigravity.exe, CopilotToAntigravity.cs, Build-And-Install.ps1, Build-And-Install.bat, install.ps1, install.bat, README.md dist/AntigravityCopilotKeyShortcut/
          Compress-Archive -Path dist/AntigravityCopilotKeyShortcut -DestinationPath AntigravityCopilotKeyShortcut.zip -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AntigravityCopilotKeyShortcut
          path: |
            CopilotToAntigravity.exe
            AntigravityCopilotKeyShortcut.zip

      - name: Extract release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $notes = ""
          if (Test-Path "CHANGELOG.md") {
            $lines = Get-Content "CHANGELOG.md"
            $capturing = $false
            $captured = @()
            foreach ($line in $lines) {
              if ($line -match "^##\s+\[?$([regex]::Escape($tag))\]?\b") {
                $capturing = $true
                continue
              }
              if ($capturing -and $line -match "^##\s+") {
                break
              }
              if ($capturing) {
                $captured += $line
              }
            }
            $notes = ($captured -join "`n").Trim()
          }
          if (-not $notes) {
            $notes = (git tag -l --format='%(contents)' $tag | Out-String).Trim()
          }
          Set-Content -Path "release_notes.md" -Value $notes -Encoding UTF8

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          generate_release_notes: true
          files: |
            CopilotToAntigravity.exe
            AntigravityCopilotKeyShortcut.zip

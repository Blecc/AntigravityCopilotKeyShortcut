name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile CopilotToAntigravity.exe
        shell: pwsh
        run: |
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:winexe /platform:x64 /optimize+ `
            /out:"CopilotToAntigravity.exe" `
            /r:System.Windows.Forms.dll `
            /r:System.Drawing.dll `
            "CopilotToAntigravity.cs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package release ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/AntigravityCopilotKeyShortcut | Out-Null
          Copy-Item CopilotToAntigravity.exe, CopilotToAntigravity.cs, Build-And-Install.ps1, Build-And-Install.bat, install.ps1, install.bat, README.md dist/AntigravityCopilotKeyShortcut/
          Compress-Archive -Path dist/AntigravityCopilotKeyShortcut -DestinationPath AntigravityCopilotKeyShortcut.zip -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AntigravityCopilotKeyShortcut
          path: |
            CopilotToAntigravity.exe
            AntigravityCopilotKeyShortcut.zip

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            CopilotToAntigravity.exe
            AntigravityCopilotKeyShortcut.zip
